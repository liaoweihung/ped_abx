<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>兒科常用針劑速查</title>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T5R33JYTC0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-T5R33JYTC0');
    </script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#27ae60">
    <link rel="icon" href="icon_inj.png" type="image/png">
    <link rel="apple-touch-icon" href="icon_inj.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="stylesheet" href="style_inj.css">
</head>
<body>

<div class="container">
    <header>
        <h2>
            <img src="icon_inj.png" class="icon-img" onerror="this.style.display='none'">
            兒科常用針劑速查
        </h2>
        <a href="index.html" class="nav-link">前往：小兒口服速算 💊</a>
    </header>

    <div class="content">
        <div class="input-section">
            <div class="form-group">
                <label for="category">藥品分類</label>
                <select id="category" onchange="renderDrugSelect()">
                    <option value="anti">抗感染症 (Anti-infective)</option>
                    <option value="non">非抗感染症 (Non-anti-infective)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="drug">藥品名稱 (學名, 規格)</label>
                <select id="drug" onchange="resetResult()"></select>
            </div>

            <div class="form-group">
                <label for="weight">體重 (kg)</label>
                <input type="number" id="weight" placeholder="輸入體重" step="0.1" inputmode="decimal">
            </div>

            <button class="calc-btn" onclick="calculate()">計算用量</button>
        </div>

        <div id="result-area" class="result-card">
            <div class="res-header">
                <span>建議抽藥量 & 頻次</span>
                <small id="res-drug-unit">--</small>
            </div>
            
            <div id="stage-neonate" class="stage-row">
                <div class="stage-label">Neonate<br><small style="font-weight:normal;color:#999">新生兒</small></div>
                <div style="flex:1; text-align:right;">
                    <span class="stage-val" id="val-neonate">--</span>
                    <span class="unit-tag" id="unit-neonate"></span>
                </div>
                <div class="stage-freq" id="freq-neonate">--</div>
            </div>

            <div id="stage-infant" class="stage-row">
                <div class="stage-label">Infant<br><small style="font-weight:normal;color:#999">嬰兒</small></div>
                <div style="flex:1; text-align:right;">
                    <span class="stage-val" id="val-infant">--</span>
                    <span class="unit-tag" id="unit-infant"></span>
                </div>
                <div class="stage-freq" id="freq-infant">--</div>
            </div>

            <div id="stage-child" class="stage-row" style="background-color:#fefefe">
                <div class="stage-label">Child<br><small style="font-weight:normal;color:#999">兒童</small></div>
                <div style="flex:1; text-align:right;">
                    <span class="stage-val" id="val-child">--</span>
                    <span class="unit-tag" id="unit-child"></span>
                </div>
                <div class="stage-freq" id="freq-child">--</div>
            </div>
        </div>

        <div id="info-area" class="info-box" style="display:none;">
            <div class="info-block">
                <span class="info-label" style="color:#27ae60">📋 兒科常用劑量範圍</span>
                <div id="info-range"></div>
            </div>
            <div class="info-block" id="info-note-box" style="display:none; border-left-color:#e74c3c; background:#fff5f5;">
                <span class="info-label" style="color:#c0392b">⚠️ 備註 (Comment)</span>
                <div id="info-note" class="note-text"></div>
            </div>
        </div>
    </div>

    <footer>
        本頁面資訊僅供專業人參考,非專業人士勿自行調整用藥<br>
        修改日期: 20251231
    </footer>
</div>

<script src="database_inj.js"></script>
<script src="app_inj.js"></script>

<div class="creator-footer">
    <a href="https://liaoweihung.github.io/hub/index.html">&copy; 2026 💎 DiamondL 藥師開發設計</a>
    &nbsp;|&nbsp;

</div>
  
</body>
</html>
