<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>兒科常用針劑速查</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#27ae60">
    <link rel="apple-touch-icon" href="icon_inj.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        body { font-family: "Microsoft JhengHei", -apple-system, sans-serif; background-color: #f0f2f5; margin: 0; padding: 0; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; min-height: 100vh; display: flex; flex-direction: column; }
        
        header { background: linear-gradient(135deg, #27ae60, #2ecc71); color: white; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100; }
        header h2 { margin: 0; font-size: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .icon-img { width: 35px; height: 35px; border-radius: 50%; border: 2px solid white; background: white; }

        .content { padding: 15px; flex: 1; }

        .input-section { background: #fff; padding: 15px; border-radius: 10px; border: 1px solid #e0e0e0; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: bold; color: #2c3e50; font-size: 15px; }
        select, input { width: 100%; padding: 12px; border: 1px solid #bdc3c7; border-radius: 8px; font-size: 16px; background: #fff; box-sizing: border-box; }
        select:focus, input:focus { border-color: #27ae60; outline: none; box-shadow: 0 0 0 3px rgba(39, 174, 96, 0.1); }

        .calc-btn { width: 100%; padding: 14px; background: #e67e22; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #d35400; transition: all 0.1s; }
        .calc-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #d35400; }

        .result-card { display: none; margin-top: 20px; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; background: white; }
        .res-header { background: #27ae60; color: white; padding: 10px 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        
        .stage-row { display: flex; border-bottom: 1px solid #eee; padding: 12px 15px; align-items: center; }
        .stage-row:last-child { border-bottom: none; }
        .stage-label { flex: 0 0 80px; font-weight: bold; color: #555; font-size: 14px; }
        .stage-val { flex: 1; text-align: right; font-size: 18px; font-weight: bold; color: #2c3e50; }
        .stage-freq { font-size: 13px; color: #e67e22; background: #fff3e0; padding: 2px 6px; border-radius: 4px; margin-left: 8px; white-space: nowrap; }
        .unit-tag { font-size: 12px; color: #888; margin-left: 2px; font-weight: normal; }

        .info-box { margin-top: 25px; font-size: 14px; color: #444; }
        .info-block { background: #f8f9fa; border-left: 4px solid #95a5a6; padding: 12px; margin-bottom: 10px; border-radius: 4px; }
        .info-label { font-weight: bold; display: block; margin-bottom: 5px; color: #2c3e50; }
        .note-text { color: #c0392b; white-space: pre-line; }

        footer { text-align: center; padding: 20px; background: #eee; font-size: 12px; color: #888; margin-top: auto; line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2>
            <img src="icon_inj.png" class="icon-img" onerror="this.style.display='none'">
            兒科常用針劑速查
        </h2>
    </header>

    <div class="content">
        <div class="input-section">
            <div class="form-group">
                <label for="category">藥品分類</label>
                <select id="category" onchange="renderDrugSelect()">
                    <option value="anti">抗感染症 (Anti-infective)</option>
                    <option value="non">非抗感染症 (Non-anti-infective)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="drug">藥品名稱 (學名, 規格)</label>
                <select id="drug" onchange="resetResult()"></select>
            </div>

            <div class="form-group">
                <label for="weight">體重 (kg)</label>
                <input type="number" id="weight" placeholder="輸入體重" step="0.1" inputmode="decimal">
            </div>

            <button class="calc-btn" onclick="calculate()">計算用量</button>
        </div>

        <div id="result-area" class="result-card">
            <div class="res-header">
                <span>建議抽藥量 & 頻次</span>
                <small id="res-drug-unit">--</small>
            </div>
            
            <div id="stage-neonate" class="stage-row">
                <div class="stage-label">Neonate<br><small style="font-weight:normal;color:#999">新生兒</small></div>
                <div style="flex:1; text-align:right;">
                    <span class="stage-val" id="val-neonate">--</span>
                    <span class="unit-tag" id="unit-neonate"></span>
                </div>
                <div class="stage-freq" id="freq-neonate">--</div>
            </div>

            <div id="stage-infant" class="stage-row">
                <div class="stage-label">Infant<br><small style="font-weight:normal;color:#999">嬰兒</small></div>
                <div style="flex:1; text-align:right;">
                    <span class="stage-val" id="val-infant">--</span>
                    <span class="unit-tag" id="unit-infant"></span>
                </div>
                <div class="stage-freq" id="freq-infant">--</div>
            </div>

            <div id="stage-child" class="stage-row" style="background-color:#fefefe">
                <div class="stage-label">Child<br><small style="font-weight:normal;color:#999">兒童</small></div>
                <div style="flex:1; text-align:right;">
                    <span class="stage-val" id="val-child">--</span>
                    <span class="unit-tag" id="unit-child"></span>
                </div>
                <div class="stage-freq" id="freq-child">--</div>
            </div>
        </div>

        <div id="info-area" class="info-box" style="display:none;">
            <div class="info-block">
                <span class="info-label" style="color:#27ae60">📋 兒科常用劑量範圍</span>
                <div id="info-range"></div>
            </div>
            <div class="info-block" id="info-note-box" style="display:none; border-left-color:#e74c3c; background:#fff5f5;">
                <span class="info-label" style="color:#c0392b">⚠️ 備註 (Comment)</span>
                <div id="info-note" class="note-text"></div>
            </div>
        </div>
    </div>

    <footer>
        本頁面資訊僅供專業人參考,非專業人士勿自行調整用藥<br>
        修改日期: 20251231
    </footer>
</div>

    function renderDrugSelect() {
        const cat = document.getElementById('category').value;
        const select = document.getElementById('drug');
        select.innerHTML = '';
        
        db[cat].forEach((d, index) => {
            const opt = document.createElement('option');
            opt.value = index;
            opt.text = `${d.name} (${d.generic}, ${d.spec})`;
            select.add(opt);
        });
        resetResult();
    }

    function resetResult() {
        document.getElementById('result-area').style.display = 'none';
        document.getElementById('info-area').style.display = 'none';
    }

    function calculate() {
        const cat = document.getElementById('category').value;
        const drugIdx = document.getElementById('drug').value;
        const weight = parseFloat(document.getElementById('weight').value);
        
        if (!weight || weight <= 0) {
            alert("請輸入有效體重");
            return;
        }

        const drug = db[cat][drugIdx];
        
        // Render Title Unit
        document.getElementById('res-drug-unit').innerText = `規格: ${drug.spec}`;

        // Render Rows
        renderStageRow('neonate', drug.dosages.neonate, weight, drug.strength, drug.unitName);
        renderStageRow('infant', drug.dosages.infant, weight, drug.strength, drug.unitName);
        renderStageRow('child', drug.dosages.child, weight, drug.strength, drug.unitName);

        // Render Info
        document.getElementById('info-range').innerHTML = drug.rangeText;
        
        const noteBox = document.getElementById('info-note-box');
        if (drug.note) {
            document.getElementById('info-note').innerText = drug.note;
            noteBox.style.display = 'block';
        } else {
            noteBox.style.display = 'none';
        }

        document.getElementById('result-area').style.display = 'block';
        document.getElementById('info-area').style.display = 'block';
    }

    function renderStageRow(elementId, doseData, weight, strength, unitName) {
        const valSpan = document.getElementById(`val-${elementId}`);
        const unitSpan = document.getElementById(`unit-${elementId}`);
        const freqDiv = document.getElementById(`freq-${elementId}`);
        const row = document.getElementById(`stage-${elementId}`);

        if (!doseData) {
            valSpan.innerText = "--";
            unitSpan.innerText = "";
            freqDiv.innerText = "無建議";
            row.style.opacity = "0.5";
            return;
        }

        row.style.opacity = "1";
        
        // Calculate
        // Dose min/max (mg or Units)
        const totalMin = weight * doseData.min;
        const totalMax = weight * doseData.max;

        // Convert to Vial/Amp
        const vialsMin = totalMin / strength;
        const vialsMax = totalMax / strength;

        // Format Text
        let resText = "";
        if (vialsMin === vialsMax) {
            resText = formatNum(vialsMin);
        } else {
            resText = `${formatNum(vialsMin)} ~ ${formatNum(vialsMax)}`;
        }

        if (doseData.isUnit) {
             // For Penicillin (Units), maybe show simple numbers?
             // But prompt asked for vials/amps. Keep vials.
        }

        valSpan.innerText = resText;
        unitSpan.innerText = unitName;
        freqDiv.innerText = doseData.freq || "";
    }

    function formatNum(num) {
        // Remove trailing zeros, max 3 decimals
        return parseFloat(num.toFixed(3));
    }

    // Init
    renderDrugSelect();
    
    // SW Registration
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js');
        });
    }
</script>

</body>
</html>
